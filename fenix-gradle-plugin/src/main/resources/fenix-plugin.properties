# Expanded at build time; read by fr.d4emon.fenix.gradle.FenixDevPlugin for the
# extension defaults and tool versions.
# Every Fenix module is versioned on its own axis, so each coordinate the plugin
# writes needs its own line here. Sharing one version between them resolves
# inside this repository — a composite build substitutes the projects and never
# looks at the number — and then fails for everyone else, against the published
# repository, where the number is all there is.
#
# The loader: what a mod's `depends.fenix` names.
version=${loader_version}
# The API set, which carries the game version because it is built against it.
api=${api_version}
# Ember, likewise built against the game.
ember=${ember_version}
# The annotation processor that writes the mod index.
processor=${processor_version}
minecraft=${minecraft_version}
vineflower=${vineflower_version}
